name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goimpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: goimpl/go.mod
          cache-dependency-path: goimpl/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go test -race -count=1 ./...

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install asn1tools
      # A stray "--" inside an ASN.1 comment closes it; this has broken the
      # schema before (see DEVELOPMENT_LOG.md), so every change compiles it.
      - name: compile node.asn
        run: python -c "import asn1tools; asn1tools.compile_files('node.asn')"
